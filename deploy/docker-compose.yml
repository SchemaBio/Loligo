name: zhiji-loligo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      LOLIGO_DB_PASSWORD: ${LOLIGO_DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/10-init-databases.sql.template:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  zhiji:
    build:
      context: ../../ZhiJi
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PASSWORD_HASH_ENABLED: "false"
        NEXT_PUBLIC_PRIVACY_CONSENT_REQUIRED: "true"
    image: schemabio/zhiji:self-hosted
    restart: unless-stopped
    environment:
      ZHIJI_API_URL: /api
      ZHIJI_BACKEND: loligo
      ZHIJI_DEFAULT_LOCALE: ${ZHIJI_DEFAULT_LOCALE:-zh-CN}
      ZHIJI_SERVER_API_URL: http://host.docker.internal:${LOLIGO_PORT:-8082}/api
      ZHIJI_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@schemabio.com}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${ZHIJI_PORT:-3002}:3000"

volumes:
  postgres-data:
